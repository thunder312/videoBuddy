# Kopiere diese Datei nach config.yaml und trage deine Werte ein.
# config.yaml steht in .gitignore, falls du das Projekt in ein Repo packst -
# darin stehen Dropbox-Zugangsdaten.

# Sendernamen wie sie im EPG-Feed für "channel" auftauchen (Schlüssel) und
# der Name des passenden Streams aus streams.py -> fetch_live_streams()
# (Wert, muss exakt oder als Teilstring zum "Titel"-Feld aus live-streams.json
# passen, z. B. "ARD Livestream", "ZDF Livestream", "ZDF.neo Livestream",
# "WDR Livestream (Deutschland)", "BR Süd Livestream", "NDR Niedersachsen",
# "MDR Sachsen Livestream", "SWR BW Livestream", "HR Livestream",
# "RBB Berlin Livestream", "SR Livestream", "KiKA Livestream",
# "PHOENIX Livestream", "ARTE.DE Livestream", "3Sat Livestream").
#
# Linke Seite (EPG-Channel-ID) gegen die unten stehende epg_urls-Quelle
# (epgshare01.online, Stand 2026-08-14) verifiziert. Nutzt du eine andere
# EPG-Quelle, ändern sich diese IDs (siehe README, Punkt 1) - z. B. nutzt
# epgshare01 einen gemeinsamen Feed "SWR/SR.de" für SWR und SR, ein eigener
# "sr.de"-Eintrag entfällt dadurch.
channel_map:
  "Das.Erste.de": "ARD Livestream"
  "ZDF.de":       "ZDF Livestream"
  "ZDFneo.de":    "ZDF.neo Livestream"
  "ZDFinfo.de":   "ZDF.info Livestream"
  "WDR.de":       "WDR Livestream (Deutschland)"
  "BR.de":        "BR Süd Livestream"
  "NDR.de":       "NDR Niedersachsen"
  "MDR.de":       "MDR Sachsen Livestream"
  "SWR/SR.de":    "SWR BW Livestream"
  "HR.de":        "HR Livestream"
  "RBB.de":       "RBB Berlin Livestream"
  "KIKA.de":      "KiKA Livestream"
  "PHOENIX.de":   "PHOENIX Livestream"
  "ARTE.de":      "ARTE.DE Livestream"
  "3sat.de":      "3Sat Livestream"

# EPG-Quelle(n) im XMLTV-Format. Mehrere URLs werden zusammengeführt.
# epgshare01.online: kostenloser, community-betriebener XMLTV-Aggregator,
# deckt ARD/ZDF/Dritte/3sat/arte/phoenix/KiKA ab (live gegen echte Daten
# geprüft, siehe README "Was schon getestet ist"). Liefert nur .xml.gz
# (ohne Content-Encoding-Header) - epg.py entpackt das automatisch.
epg_urls:
  - "https://epgshare01.online/epgshare01/epg_ripper_DE1.xml.gz"

# Schlagworte, die eine Sendung als Spielfilm markieren (Kleinschreibung
# egal, wird gegen category-Tags UND Titel geprüft). Die generische
# "Spielfilm"/"Fernsehfilm"-Kategorie gibt es bei epgshare01 NICHT - die
# Quelle nutzt stattdessen sehr granulare zusammengesetzte Genre-Tags
# (z. B. "Actionfilm", "Krimidrama", "Liebeskomödie", "Historiendrama").
# Diese Stämme fangen die meisten davon per Teilstring ab. Nebenwirkung:
# auch (Krimi-)Serien mit solchen Tags werden als Vorschlag markiert -
# in der Praxis meist unproblematisch (min_duration_minutes filtert kurze
# Folgen raus), sonst über "Einstellungen" weiter nachschärfen.
film_keywords:
  - "film"
  - "drama"
  - "komödie"
  - "krimi"
  - "thriller"

# Sendungen unter dieser Länge zählen nicht als Film (filtert z. B.
# Kurzformate mit falsch gesetztem Genre-Tag heraus)
min_duration_minutes: 70

# Sicherheitspuffer: Aufnahme startet X Minuten vor und endet Y Minuten nach
# der im EPG angegebenen Zeit, weil Sendungen gern überziehen
buffer_before_minutes: 3
buffer_after_minutes: 12

# Wie lange nach Sendeende gewartet wird, bevor geprüft wird, ob der Film in
# der Mediathek gelandet ist
mediathek_check_delay_hours: 72
mediathek_api_url: "https://mediathekviewweb.de/api/query"

# Wie oft (Minuten) EPG neu geladen und der Aufnahmeplan aktualisiert wird
epg_refresh_minutes: 360

# Wie oft (Sekunden) die Job-Queue auf fällige Starts/Stopps geprüft wird
poll_interval_seconds: 30

# Lokales Zwischenlager, bevor eine Aufnahme (nach dem Mediathek-Check)
# hochgeladen oder verworfen wird. ffmpeg schreibt die Aufnahme direkt
# hierhin und erst danach - nie live waehrend der Aufnahme - geht sie zu
# Dropbox. Bewusst NICHT unter ./data (siehe state_file), damit du diesen
# Pfad im Docker-Setup separat auf eine Platte mit genug Speicherplatz
# mounten kannst (siehe docker-compose.yml); im Bare-Metal-Betrieb kannst
# du hier direkt einen beliebigen absoluten Pfad eintragen.
recording_dir: "./recordings"

# Klein, aber muss dauerhaft erreichbar sein (kein Netzlaufwerk mit
# Aussetzern) - hier liegen jobs.json und settings.json.
state_file: "./data/jobs.json"

dropbox:
  # Dropbox-App unter https://www.dropbox.com/developers/apps anlegen
  # (Scoped App, Berechtigung files.content.write), dann per OAuth-Flow
  # einen Refresh Token erzeugen (siehe README der "dropbox"-Python-Lib).
  refresh_token: "TODO"
  app_key: "TODO"
  app_secret: "TODO"
  upload_folder: "/PVR-OeRR"

log_level: "INFO"
