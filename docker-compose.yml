services:
  videobuddy:
    build: .
    container_name: videobuddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      # Eigenes Volume fuer Aufnahmen, getrennt von ./data (das nur die
      # kleinen jobs.json/settings.json enthaelt). Zeig auf eine Platte mit
      # genug Platz, z. B.:
      #   - /mnt/storage/videobuddy-recordings:/app/recordings
      - ./recordings:/app/recordings
    environment:
      - TZ=Europe/Berlin
      # Fester Wert sorgt dafuer, dass eingeloggte Sessions/Flash-Meldungen
      # einen Container-Neustart ueberleben. Ohne diese Zeile wird bei jedem
      # Start ein zufaelliger Schluessel erzeugt (auch in Ordnung, da die
      # Weboberflaeche kein Login hat, nur Flash-Meldungen betroffen sind).
      # - SECRET_KEY=setze-hier-einen-zufaelligen-langen-string
